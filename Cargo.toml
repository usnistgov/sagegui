# Derived from jspaezp/sagegui (Apache 2.0, J. Sebastian Paez).
# Modified by Benjamin A. Neely (NIST) on 2026-07-10: updated Sage dependency to
# v0.15.0-beta.2, pinned to commit hash, added log/env_logger.
[package]
name = "sagegui"
version = "0.7.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
eframe = "0.29.0"
egui = "0.29.0"
rfd = "0.15.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Pinned to v0.15.0-beta.2 plus our own additive patches (commit cf20b75b).
# These are git dependencies, so cargo compiles the fork as part of every build —
# our CI therefore covers the fork on all four target platforms. Patch inventory
# and the merge-conflict guide for the next Sage sync live in NOTES.md, under
# "Custom patch carried on neely/sage". Add any new patch to that list.
sage-core = { git = "https://github.com/neely/sage.git", rev = "cf20b75b00deec84e69a773e9c3468f6f7935a7f" }
sage-cli = { git = "https://github.com/neely/sage.git", rev = "cf20b75b00deec84e69a773e9c3468f6f7935a7f" }
sage-cloudpath = { git = "https://github.com/neely/sage.git", rev = "cf20b75b00deec84e69a773e9c3468f6f7935a7f" }
timsrust = "0.4.1"
num_cpus = "1.13"
egui_extras = { version = "0.29.1", features = ["all_loaders"] }
image = { version = "0.24", features = ["png"] }
env_logger = "0.11.5"
log = "0.4"
flate2 = "1.1"

[profile.release]
lto = "thin"
codegen-units = 1
