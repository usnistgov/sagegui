# Derived from jspaezp/sagegui (Apache 2.0, J. Sebastian Paez).
# Modified by Benjamin A. Neely (NIST) on 2026-07-10: updated Sage dependency to
# v0.15.0-beta.2, pinned to commit hash, added log/env_logger.
# Modified by Benjamin A. Neely (NIST) on 2026-09-23: Sage vendored in
# vendor/sage, database cache, and license-file in place of license.
[package]
name = "sagegui"
version = "0.9.0"
edition = "2021"
# The tree is mixed: NIST-developed code (LICENSE.md), code derived from
# jspaezp/sagegui (Apache-2.0) and vendored Sage (MIT). No single SPDX
# identifier is true for all of it, so name the file that explains it.
license-file = "LICENSE.md"

[dependencies]
eframe = { version = "0.29.0", features = ["persistence"] }
egui = "0.29.0"
rfd = "0.15.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Sage is vendored in vendor/sage: lazear/sage master at d74024d (10 commits
# after v0.15.0-beta.2) plus our additive patches. The source and base commit are
# in vendor/sage/VENDORED.md. Every change to Sage is listed in
# vendor/sage/PATCHES.md. Add any new patch there. To update Sage, see
# MAINTENANCE.md.
sage-core = { path = "vendor/sage/crates/sage" }
sage-cli = { path = "vendor/sage/crates/sage-cli" }
sage-cloudpath = { path = "vendor/sage/crates/sage-cloudpath" }
timsrust = "0.4.1"
num_cpus = "1.13"
egui_extras = { version = "0.29.1", features = ["all_loaders"] }
image = { version = "0.24", features = ["png"] }
env_logger = "0.11.5"
log = "0.4"
flate2 = "1.1"
# Database cache (src/index_cache.rs). `twox-hash` hashes the cache key and
# checks the cache file. It was already in the tree through timsrust, so this
# adds no new package.
twox-hash = { version = "2", default-features = false, features = ["std", "xxhash3_64", "xxhash3_128"] }

[profile.release]
lto = "thin"
codegen-units = 1
