# Derived from jspaezp/sagegui (Apache 2.0, J. Sebastian Paez).
# Modified by Benjamin A. Neely (NIST) on 2026-07-13: added rustfmt/clippy/test
# steps, multi-platform matrix, release artifact packaging, and generate_release_notes.
# Modified by Benjamin A. Neely (NIST) on 2026-09-09: split the macOS matrix
# legs onto native per-architecture runners, added --target to every build and
# test command, switched macOS conditionals to runner.os, and replaced the
# archived toolchain action and hand-rolled cache with dtolnay/rust-toolchain
# and Swatinem/rust-cache.
#
# Both macOS legs used to run on one shared runner (macos-latest, Apple
# Silicon). `cargo build --release` carried no --target, so both legs built
# for the runner's own architecture. Proof: v0.7.1's published
# sage-launcher-macos-x64.zip and sage-launcher-macos-arm64.zip were
# BYTE-IDENTICAL, and both contained an arm64 binary. Intel users got an
# unrunnable download. Fix: a native runner per architecture, plus --target
# on every cargo command that builds or tests. Do not merge these two legs
# back onto one runner.

name: Build and Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: sagegui.exe
            asset_name: sage-launcher-windows-x64.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: sagegui
            asset_name: sage-launcher-linux-x64
          # macos-13 is RETIRED. macos-15-intel is the Intel runner.
          - os: macos-15-intel
            target: x86_64-apple-darwin
            artifact_name: sagegui
            asset_name: sage-launcher-macos-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: sagegui
            asset_name: sage-launcher-macos-arm64

    steps:
      - uses: actions/checkout@v5

      # Linux ran OUT OF DISK on sageRecon's CI (run 33683133213):
      # "No space left on device" while linking rustc's rmeta output.
      # `cargo test` builds the whole tree in debug, then `cargo build
      # --release` builds it again, and Sage pulls in arrow, parquet, and
      # object_store. sagegui depends on the same Sage crates. The
      # preinstalled toolchains removed below are not used by this build.
      - name: Free Disk Space
        if: runner.os == 'Linux'
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Check Format
        run: cargo fmt -- --check

      - name: Clippy
        run: cargo clippy -- -D warnings

      - name: Run Tests
        run: cargo test --verbose --target ${{ matrix.target }}

      - name: Build Release
        run: cargo build --verbose --release --target ${{ matrix.target }}

      - name: Create macOS App Bundle
        if: runner.os == 'macOS'
        shell: bash
        run: |
          BUNDLE="target/${{ matrix.target }}/release/Sage Launcher.app"
          VERSION=$(grep '^version' Cargo.toml | head -1 | cut -d '"' -f2)
          mkdir -p "$BUNDLE/Contents/MacOS" "$BUNDLE/Contents/Resources"
          cp target/${{ matrix.target }}/release/${{ matrix.artifact_name }} "$BUNDLE/Contents/MacOS/"
          cp assets/AppIcon.icns "$BUNDLE/Contents/Resources/AppIcon.icns"
          cat > "$BUNDLE/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>${{ matrix.artifact_name }}</string>
              <key>CFBundleIconFile</key>
              <string>AppIcon.icns</string>
              <key>CFBundleIdentifier</key>
              <string>gov.nist.sagegui</string>
              <key>CFBundleName</key>
              <string>Sage Launcher</string>
              <key>CFBundleDisplayName</key>
              <string>Sage Launcher</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>$VERSION</string>
              <key>CFBundleVersion</key>
              <string>$VERSION</string>
              <key>LSMinimumSystemVersion</key>
              <string>10.13</string>
              <key>NSHighResolutionCapable</key>
              <true/>
          </dict>
          </plist>
          PLIST
          # Without this Info.plist/bundle structure, Finder/LaunchServices treats
          # the raw binary as a plain Unix executable and runs it via Terminal.app
          # instead of launching it directly as a windowed app — the "a terminal
          # window opens alongside the GUI" bug (found in live testing 2026-08-24).
          #
          # Seal the finished bundle with an ad-hoc signature, then prove it.
          # Before this, the arm64 binary carried only the linker's signature and
          # nothing sealed the bundle, so Info.plist and the icon were uncovered
          # and `codesign --verify --strict` failed with "code has no resources
          # but signature indicates they must be present". The x86_64 binary was
          # not signed at all, because the linker only auto-signs on arm64.
          #
          # This does NOT get a downloaded app past Gatekeeper. That needs Developer
          # ID signing and Apple notarization, which this project does not have
          # (maintainer decision 2026-09-10: no Apple Developer account for now).
          # Users still need the `xattr` step in the README. What this fixes is a
          # bundle that is internally invalid.
          codesign --force --deep --sign - "$BUNDLE"
          codesign --verify --deep --strict --verbose=2 "$BUNDLE"

      - name: Create Release Archive
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a ../../../${{ matrix.asset_name }}.zip ${{ matrix.artifact_name }}
          elif [ "${{ runner.os }}" = "macOS" ]; then
            # ditto is Apple's supported way to archive a signed bundle.
            ditto -c -k --keepParent "Sage Launcher.app" ../../../${{ matrix.asset_name }}.zip
            # Verify the archive users actually download, not just the bundle on
            # disk. A seal that does not survive archiving is the same bug.
            CHECK=$(mktemp -d)
            ditto -x -k ../../../${{ matrix.asset_name }}.zip "$CHECK"
            codesign --verify --deep --strict --verbose=2 "$CHECK/Sage Launcher.app"
          else
            tar -czf ../../../${{ matrix.asset_name }}.tar.gz ${{ matrix.artifact_name }}
          fi
          cd ../../..

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ runner.os == 'macOS' && format('target/{0}/release/Sage Launcher.app', matrix.target) || format('target/{0}/release/{1}', matrix.target, matrix.artifact_name) }}

      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ${{ matrix.asset_name }}.*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
