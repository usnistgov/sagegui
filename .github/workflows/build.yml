# Derived from jspaezp/sagegui (Apache 2.0, J. Sebastian Paez).
# Modified by Benjamin A. Neely (NIST) on 2026-07-13: added rustfmt/clippy/test
# steps, multi-platform matrix, release artifact packaging, and generate_release_notes.
name: Build and Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: sagegui.exe
            asset_name: sage-launcher-windows-x64.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: sagegui
            asset_name: sage-launcher-linux-x64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: sagegui
            asset_name: sage-launcher-macos-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: sagegui
            asset_name: sage-launcher-macos-arm64

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}
          override: true
          components: rustfmt, clippy

      - name: Install Linux Dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev

      - name: Cache Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Check Format
        run: cargo fmt -- --check

      - name: Clippy
        run: cargo clippy -- -D warnings

      - name: Run Tests
        run: cargo test --verbose

      - name: Build Release
        run: cargo build --verbose --release

      - name: Create macOS App Bundle
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          BUNDLE="target/release/Sage Launcher.app"
          VERSION=$(grep '^version' Cargo.toml | head -1 | cut -d '"' -f2)
          mkdir -p "$BUNDLE/Contents/MacOS" "$BUNDLE/Contents/Resources"
          cp target/release/${{ matrix.artifact_name }} "$BUNDLE/Contents/MacOS/"
          cp assets/AppIcon.icns "$BUNDLE/Contents/Resources/AppIcon.icns"
          cat > "$BUNDLE/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>${{ matrix.artifact_name }}</string>
              <key>CFBundleIconFile</key>
              <string>AppIcon.icns</string>
              <key>CFBundleIdentifier</key>
              <string>gov.nist.sagegui</string>
              <key>CFBundleName</key>
              <string>Sage Launcher</string>
              <key>CFBundleDisplayName</key>
              <string>Sage Launcher</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>$VERSION</string>
              <key>CFBundleVersion</key>
              <string>$VERSION</string>
              <key>LSMinimumSystemVersion</key>
              <string>10.13</string>
              <key>NSHighResolutionCapable</key>
              <true/>
          </dict>
          </plist>
          PLIST
          # Without this Info.plist/bundle structure, Finder/LaunchServices treats
          # the raw binary as a plain Unix executable and runs it via Terminal.app
          # instead of launching it directly as a windowed app — the "a terminal
          # window opens alongside the GUI" bug (found in live testing 2026-08-24).

      - name: Create Release Archive
        shell: bash
        run: |
          cd target/release
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            7z a ../../${{ matrix.asset_name }}.zip ${{ matrix.artifact_name }}
          elif [ "${{ matrix.os }}" = "macos-latest" ]; then
            zip -r ../../${{ matrix.asset_name }}.zip "Sage Launcher.app"
          else
            tar -czf ../../${{ matrix.asset_name }}.tar.gz ${{ matrix.artifact_name }}
          fi
          cd ../..

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.os == 'macos-latest' && 'target/release/Sage Launcher.app' || format('target/release/{0}', matrix.artifact_name) }}

      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ${{ matrix.asset_name }}.*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
