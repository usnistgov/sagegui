# Derived from jspaezp/sagegui (Apache 2.0, J. Sebastian Paez).
# Modified by Benjamin A. Neely (NIST) on 2026-07-13: added Cargo ecosystem and
# ignore rules for pinned Sage dependencies. Modified on 2026-09-23: removed
# those rules, because Sage is now vendored.
version: 2
updates:
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"

  # Cargo (Rust dependencies)
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
    # Sage is vendored in vendor/sage as path dependencies, which dependabot
    # does not update. Update it by hand, following MAINTENANCE.md.
